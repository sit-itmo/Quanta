name: Linux builds
on: [push, pull_request]
jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        gui: [OFF, ON]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3 libxcb1-dev xvfb
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DINV_WITH_GUI=${{ matrix.gui }} -DINV_STRICT_STATIC=ON -DINV_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: ./tools/verify_static.sh build/inv
      - run: python3 tests/examples.py build/inv
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DINV_SANITIZE=ON -DINV_STRICT_STATIC=OFF -DINV_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
