name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [default, linux-no-gui, linux-minimal, portable-posix, linux-asan, linux-framebuffer]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build python3 clang libglfw3-dev libx11-dev xvfb
      - name: Configure without preset (all native features)
        if: matrix.profile == 'default'
        run: cmake -S . -B build/default -DQUANTA_WARNINGS_AS_ERRORS=ON
      - name: Configure selected preset
        if: matrix.profile != 'default'
        run: cmake --preset ${{ matrix.profile }} -DQUANTA_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build/${{ matrix.profile }} --parallel 2
      - run: ctest --test-dir build/${{ matrix.profile }} --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        profile: [default, windows-no-gui, windows-minimal, windows-framebuffer]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure without preset (all native features)
        if: matrix.profile == 'default'
        run: cmake -S . -B build/default -G "Visual Studio 17 2022" -A x64
      - name: Configure selected preset
        if: matrix.profile != 'default'
        run: cmake --preset ${{ matrix.profile }}
      - run: cmake --build build/${{ matrix.profile }} --config ${{ matrix.configuration }} --parallel 2
      - run: ctest --test-dir build/${{ matrix.profile }} -C ${{ matrix.configuration }} --output-on-failure
