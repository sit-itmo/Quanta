name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-default, linux-minimal, portable-posix, linux-asan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build python3 clang
      - run: cmake --preset ${{ matrix.preset }} -DQUANTA_WARNINGS_AS_ERRORS=ON
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-native, windows-minimal]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.configuration }} --parallel 2
      - run: ctest --test-dir build/${{ matrix.preset }} -C ${{ matrix.configuration }} --output-on-failure
